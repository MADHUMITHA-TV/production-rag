# Two-tier CI eval gate.
#
# WHY TWO TIERS, NOT ONE (revised after real evidence)
# =======================================================
# Original design: run all 25 questions (deterministic-only, no Ragas) on
# every push, since single-shot generation seemed cheap enough. Real CI
# evidence proved that wrong: a run against this shared account hit
# Groq's 200,000 token/day limit at question 20/25, because the SAME
# account is also used for local interactive development throughout the
# day. On a free tier, "cheap per call" does not mean "safe to run on
# every push" once you account for a human also actively using the same
# quota. So the fast gate now runs a small, representative smoke-test
# subset (5 questions: a mix of basic/intermediate/decline) instead of
# the full 25 -- catches obvious regressions in retrieval, citation
# logic, and decline behavior without risking the shared daily budget on
# every commit.
#
# The full 25-question set (plus, on manual/scheduled runs, the full
# Ragas-scored suite) is reserved for workflow_dispatch or the weekly
# schedule, run deliberately, not automatically on every push.
#
# SECRETS REQUIRED
# ===================
# GROQ_API_KEY must be set as a repository secret
# (Settings -> Secrets and variables -> Actions -> New repository secret).

name: RAG Evaluation Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC

jobs:
  fast-smoke-gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build embeddings index (data/chunks.jsonl is committed; data/raw is not)
        run: python ingestion/embed_and_store.py
        env:
          EMBEDDER: bge

      - name: Run smoke-test subset (5 of 25 questions -- see note above on shared free-tier quota)
        run: python eval/run_eval.py --range 1:5 --deterministic-only --allow-partial
        env:
          EMBEDDER: bge
          GENERATOR: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-smoke
          path: eval/results.jsonl

  full-ragas-gate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build embeddings index
        run: python ingestion/embed_and_store.py
        env:
          EMBEDDER: bge

      - name: Run full Ragas-scored eval gate
        run: python eval/run_eval.py
        env:
          EMBEDDER: bge
          GENERATOR: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-full
          path: |
            eval/results.jsonl
            eval/ragas_results.jsonl